<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Perspective">
  <!--
    The mark, and the source the PNG icons beside it are rendered from.

    It is an i and it is a construction. The near faces stand in the picture
    plane - the disc at eye height, the stem under it, three blocks stacked
    beside them - and every one of them throws its receding face back to a
    single vanishing point off the right edge. Cobalt for the tall block,
    orange for the middle, sky for the small one; the red belongs to the
    ruling and to nothing else, which is why the disc appears twice: once at
    arm's length, once gone to the point, the same disc and all but no width
    left in it. The white between the faces is the paper, not a stroke.

    It is laid out to the EDGE of the square - 3% of margin, and the icons
    beside it no more than 4. The mark is a quarter wider than it is tall, so
    a square frame it merely sits inside the way a portrait sits in a hall
    reads as an empty tile with a stamp in the middle of it, which is what
    the first cut of these was. Fitted to the width it runs 94% across and
    76% down, and the corners it puts nearest the rounding - the disc's left
    shoulder and the stem's foot - are still inside iOS's curve.
  -->
  <circle cx="62.67" cy="109.98" r="47.31" fill="#d5241b"/>
  <rect x="15.36" y="170.35" width="94.62" height="278.98" fill="#194db6"/>
  <rect x="123.04" y="67.02" width="120.18" height="90.27" fill="#194db6"/>
  <rect x="123.04" y="170.35" width="120.18" height="166.41" fill="#f3700c"/>
  <rect x="123.04" y="350.9" width="92.45" height="98.43" fill="#2e8ccc"/>
  <polygon points="255.18,74.64 470.54,211.79 470.54,233.21 255.18,161.29" fill="#194db6"/>
  <polygon points="255.18,173.82 470.54,236.3 470.54,275.78 255.18,333.55" fill="#f3700c"/>
  <polygon points="255.18,339.43 470.54,277.23 470.54,298.6 255.18,425.87" fill="#2e8ccc"/>
  <ellipse cx="486.85" cy="256" rx="9.79" ry="42.15" fill="#d5241b"/>
</svg>
