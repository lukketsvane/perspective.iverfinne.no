<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover puts the canvas under the notch and the home indicator;
         the UI keeps clear of them with env(safe-area-inset-*) below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perspective</title>

    <!-- Home Screen install on iOS: full screen, no Safari chrome.

         The status bar is "default", not "black-translucent": translucent means
         white text whatever is behind it, and what is behind it here is usually
         paper. Default lets iOS paint the bar from theme-color below - which the
         app keeps pointed at the live paper tone, so the bar melts into the
         sheet and the clock stays black-on-paper or chalk-on-board with it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Perspective" />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Full viewport sizing with iOS safe area support */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height for mobile */
        overflow: hidden;
        background-color: #f7f4ef;
        touch-action: none;
        -webkit-overflow-scrolling: touch;
        /* Prevent PWA bottom gap on iOS standalone mode */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Disabling selection to make gestures smoother */
      * { user-select: none; -webkit-user-select: none; }
      /* No grey flash on tap, no magnifier, no rubber band. */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      /* Controls stay visually weightless over the scene: no raised chrome or
         filled button states. Shape, border, icon and text carry the UI. */
      button {
        background-color: transparent !important;
        background-image: none !important;
        box-shadow: none !important;
      }
      [class*="shadow"] { box-shadow: none !important; }
      html, body { overscroll-behavior: none; }

      /*
       * Safe areas belong on the floating UI, not on the body: the canvas
       * should run edge to edge under the notch and the home indicator, while
       * every control stays inside the safe box.
       */
      .bottom-safe-panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }
      /*
       * ...and the TOP, which only the tour's card uses.
       *
       * Every other panel in the tool hangs off the bottom edge, because that
       * is where the thumbs are - so the top is the one band nothing else
       * claims, and a card that sits there covers neither the dock, nor the
       * panel slot, nor the walk quadrant in the bottom-left. It has to clear
       * the notch and the status bar like everything else.
       */
      .top-safe-panel { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); }
      /*
       * ...and the SIDES, which only matter when the phone is on its side and
       * are the whole difference there. Held in landscape the notch takes about
       * 44 px off one edge and the rounded corners a little off both, and the
       * dock's two clusters are anchored to exactly those corners - so the
       * left-hand one sat under the notch, with the control at its end
       * unreachable. Upright both insets are zero and this is the 0.75rem the
       * padding always was.
       */
      .x-safe-panel {
        padding-left: calc(env(safe-area-inset-left, 0px) + 0.75rem);
        padding-right: calc(env(safe-area-inset-right, 0px) + 0.75rem);
      }

      /* A flick strip has no room for a scrollbar, and never needs one. */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }

      /*
       * The activity hairline: a segment running the top edge while the tool is
       * waiting on something, and the whole line fading out in red when what it
       * waited on never arrived.
       */
      @keyframes perspective-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      @keyframes perspective-fade {
        0%   { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Standing still, it is still a line that is there or not there. */
        @keyframes perspective-sweep {
          0%, 100% { transform: translateX(100%); }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
