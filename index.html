<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover puts the canvas under the notch and the home indicator;
         the UI keeps clear of them with env(safe-area-inset-*) below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perspective — cubes at eye level</title>

    <!-- Home Screen install on iOS: full screen, no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perspective" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Full viewport sizing with iOS safe area support */
      :root {
        --vh: 1vh;
      }
      body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        min-height: 100vh;
        min-height: calc(var(--vh, 1vh) * 100);
        min-height: 100dvh; /* Dynamic viewport height for mobile */
        overflow: hidden; 
        background-color: #f3f3f1; 
        touch-action: none;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Disabling selection to make gestures smoother */
      * { user-select: none; -webkit-user-select: none; }
      /* No grey flash on tap, no magnifier, no rubber band. */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      html, body { overscroll-behavior: none; }

      /*
       * Safe areas belong on the floating UI, not on the body: the canvas
       * should run edge to edge under the notch and the home indicator, while
       * every control stays inside the safe box.
       */
      .safe-top    { padding-top: env(safe-area-inset-top, 0px); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .safe-x {
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .inset-safe-top    { top: calc(env(safe-area-inset-top, 0px) + 0.75rem); }
      .inset-safe-bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem); }
      .inset-safe-right  { right: calc(env(safe-area-inset-right, 0px) + 0.75rem); }

      /*
       * Clearance above the thumb bar.
       *
       * The bar is 56 px of buttons plus its own padding, and then however much
       * home-indicator the phone reserves - which is 34 px on a notched iPhone
       * and nothing on a desktop. A fixed bottom-24 was measured against the
       * first two and landed inside the third, which is how the selection
       * controls ended up underneath the bar on an iPhone.
       */
      /*
       * The bar is 56 px of button + 6 px of its own padding + 12 px of page
       * padding = 74, then the reserved inset. Eight pixels of air above that
       * is a gap; anything more is a hole.
       */
      .above-bar { bottom: calc(env(safe-area-inset-bottom, 0px) + 5.125rem); }
      /* Second row up: clear of the bar *and* of the strip sitting on it. */
      .above-bar-2 { bottom: calc(env(safe-area-inset-bottom, 0px) + 9rem); }

      /* A flick strip has no room for a scrollbar, and never needs one. */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
