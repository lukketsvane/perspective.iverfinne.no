<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover puts the canvas under the notch and the home indicator;
         the UI keeps clear of them with env(safe-area-inset-*) below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perspective</title>

    <!-- Home Screen install on iOS: full screen, no Safari chrome.

         The status bar is "default", not "black-translucent", and this is
         SETTLED rather than pending - it was carried as an open question for
         several rounds and it should not have been.

         black-translucent puts the canvas under the clock, which is more
         screen and looks more like an app, and it forces the clock and the
         battery to WHITE whatever is behind them. What is behind them here is
         a sheet of paper about three quarters of the time: the deck runs from
         18 to 252 and most of it is light. White on white is a status bar you
         cannot read, on the one screen a phone always shows.

         default lets iOS paint the bar from theme-color below, and index.tsx
         points that at the dealt page's own mount before React mounts while
         App.tsx keeps it there afterwards - so the bar melts into the sheet
         and the clock stays black-on-paper or chalk-on-board with it, both
         ways round, on all twenty-three pages.

         The cost is real and it is the smaller one: viewport-fit=cover and
         env(safe-area-inset-top) only bite under black-translucent, so at the
         top of the screen those are inert. They are left in because the SIDES
         and the BOTTOM use the same insets and do need them in landscape, and
         because the day this app grows a dark-only page deck is the day the
         other setting becomes right. -->
    <!-- (Everything above is about the standalone home-screen app, which is
         how this tool is used nine times in ten.) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Perspective" />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The mark is a vector and browsers that can take it get it that way;
         the .ico carries 16, 32 and 48 for the ones that cannot, and answers
         the bare /favicon.ico a browser asks for whether or not it is named. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Full viewport sizing with iOS safe area support */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height for mobile */
        overflow: hidden;
        background-color: #f7f4ef;
        touch-action: none;
        -webkit-overflow-scrolling: touch;
        /* Prevent PWA bottom gap on iOS standalone mode */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Disabling selection to make gestures smoother */
      * { user-select: none; -webkit-user-select: none; }
      /* No grey flash on tap, no magnifier, no rubber band. */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      /* Controls stay visually weightless over the scene: no raised chrome or
         filled button states. Shape, border, icon and text carry the UI. */
      button {
        background-color: transparent !important;
        background-image: none !important;
        box-shadow: none !important;
      }
      /*
       * That used to be followed by `[class*="shadow"] { box-shadow: none }`,
       * which was aimed at buttons and hit every panel in the app as well - so
       * the shadow-2xl each of them asks for has never once been drawn.
       *
       * A shadow on a BUTTON is chrome pretending to be a physical key, and it
       * is still not wanted; the rule above already removes it, and it says so
       * on the element type rather than by guessing from a class name. A shadow
       * under a sheet of GLASS is not decoration at all - it is the only thing
       * that says the sheet is above the picture rather than painted onto it,
       * and without it a panel at a third opacity reads as a smear rather than
       * an object. It is drawn in .glass-light / .glass-dark below.
       */
      html, body { overscroll-behavior: none; }

      /*
       * THE GLASS.
       *
       * Every panel, bar and dock in this app is one of these two surfaces.
       * They are here rather than in a Tailwind string because the material is
       * six declarations that only make sense together, and because the reason
       * for each of them takes a paragraph.
       *
       * IT WAS A FLAT FILL AT 78 PER CENT, and it looked like one. The argument
       * for that number is in components/ui.ts and it was sound as far as it
       * went: the page is often black, the drawing is white paper, and a white
       * line under a lightly-tinted panel is still a white line. Opacity alone
       * cannot fix that, because opacity dims a line and keeps its STRUCTURE,
       * and structure is what the eye finds. The answer at the time was to pour
       * on more paint until nothing came through, which does work, and what you
       * have at the end is a grey slab with icons on it.
       *
       * What Apple's material actually does is not more paint - it is to
       * REMOVE THE STRUCTURE before the fill goes on:
       *
       *   blur      averages the neighbourhood, so lines become broad values
       *   contrast  collapses those values toward the middle, so what is left
       *             of the drawing is a narrow band instead of a range
       *   brightness carries that whole band up toward white (or down toward
       *             black), so the band lands where the panel wants to live
       *   saturate  puts back the colour the other two just drained, which is
       *             what stops it looking like fog
       *
       * Then a THIRD of a fill is enough, because there is nothing left under
       * it to hide. The scene goes on moving under the panel as a value - you
       * can watch the horizon cross it - and the icons sit on an object.
       *
       * The numbers: contrast .42 takes black-to-white down to a span of 0.42
       * centred on mid grey, brightness lands that span at roughly 0.49-0.89
       * on the light surface and 0.14-0.36 on the dark one, and the fill
       * closes the rest. Measured on 'Brush page on black', which is the
       * widest gap this tool can produce.
       *
       * THE LIGHT SURFACE WAS WHITER THAN THAT, and it read as paint. A lift
       * of 1.45 under a 38 per cent white fill put the panel fifty points
       * above a mid-grey page - which is a white slab standing on grey, not
       * glass standing over it. The whole argument above is that the collapse
       * does the hiding, so the tint does not have to: the lift comes down to
       * 1.2 and the fill to 22 per cent, and the panel now sits a shade above
       * whatever page it is on rather than at white regardless of it. The
       * ink is black either way - on the darkest page the light glass can
       * stand on, the icons still sit at better than five to one.
       *
       * THE RIM IS NOT DECORATION. One pixel of light along the top edge is
       * how every real piece of glass announces its own thickness, and it is
       * what separates a pane from a hole cut in the picture.
       *
       * AND IT IS THE ONLY EDGE. There was a drop shadow under it as well, on
       * the reasoning that a shadow is what says the sheet is above the picture
       * rather than painted onto it. It is not wanted: a shadow is the one part
       * of this that is not glass, it is opaque, and it lands on the drawing -
       * so a panel that was brought in to stop covering the picture arrived
       * with a soft grey halo forty pixels deep laid over the very thing it
       * had just stopped hiding. The rim says the same thing and costs the
       * drawing nothing.
       *
       * AND IT GOES INERT FOR A MOMENT AT A TIME. An ancestor at any opacity
       * other than 1 is a backdrop root, and a backdrop-filter inside one has
       * nothing behind it to sample - so for the length of the rail's 1500 ms
       * fade every panel here is a flat fill. It cannot be seen: the same fade
       * has the panel at a fraction of its own opacity for exactly those
       * milliseconds.
       *
       * WHICH IS WHY THE FILL IS A FLOOR AND NOT AN AFTERTHOUGHT. A
       * `will-change` hint on the dock's column once made that backdrop root
       * PERMANENT - every pane in the app fell back to its fill, full time, on
       * the phones this tool is mostly used on - and a fill chosen on the
       * assumption the collapse is always there was a ghost: icons floating
       * on the picture with a hairline round them. The hint is gone, but the
       * lesson stays in the numbers: the fill alone must carry a legible
       * panel, because on a phone the filter is a guest. iOS Safari declines
       * to sample a WebGL canvas through a backdrop-filter often enough -
       * layer promotions, fades, its own moods - that any milliseconds it
       * grants are decoration. Sixty-five and fifty-eight per cent are the
       * floors - the weight of the system's own thick material - and they were
       * thirty once, measured against a sky: a black ink edge under thirty per
       * cent of white is still a black edge, and a panel over the drawing's
       * ink read as icons tangled in the picture. Ink under these floors is a
       * murmur with the filter dead, and with the collapse running the pane
       * still breathes - which is all a working phone can be promised.
       *
       * The collapse itself is GENTLER than it was, for the same reason: it
       * was tuned to do all the hiding under a see-through fill, and under a
       * fill that hides by itself that much contrast collapse rendered the
       * backdrop as fog. Now it rounds off what the fill has already quieted.
       */
      .glass-light,
      .glass-dark {
        -webkit-backdrop-filter: blur(28px) saturate(1.6) contrast(0.78) brightness(var(--glass-lift));
        backdrop-filter: blur(28px) saturate(1.6) contrast(0.78) brightness(var(--glass-lift));
      }
      .glass-light {
        --glass-lift: 1.08;
        background-color: rgba(250, 250, 252, 0.65);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), inset 0 -1px 0 rgba(255, 255, 255, 0.18);
      }
      .glass-dark {
        --glass-lift: 0.78;
        background-color: rgba(22, 22, 26, 0.58);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(255, 255, 255, 0.06);
      }

      /*
       * AND A ROW THAT HAS HANDED ITS GLASS TO THE THINGS STANDING IN IT.
       *
       * The dock in landscape is two clusters in the two bottom corners, and
       * the row holding them spreads to the edges and stops being a pane - the
       * whole point of the arrangement being that the middle of the frame,
       * which is where the drawing is, comes back. The row asked for that in
       * Tailwind (`bg-transparent`, `border-transparent`, `shadow-none`) and
       * did not get it: those utilities live in Tailwind's `utilities` layer,
       * the glass above is written here and is in no layer at all, and an
       * unlayered declaration beats a layered one of the same specificity
       * whatever the order of the files. So the row kept its fill, its rim and
       * its blur, and what landed on a phone held sideways was a pane the
       * width of the screen with the controls pushed to its two ends and a
       * frosted slab across the middle of the picture. It read as a bug
       * because it was one.
       *
       * Written here, beside the material it is turning off, for the reason
       * the material is here: it has to be in the same origin as the glass to
       * be able to argue with it at all. The backdrop-filter is the half that
       * matters - a transparent pane still blurs everything behind it.
       */
      @media (max-height: 560px) {
        .glass-gone {
          background-color: transparent;
          border-color: transparent;
          box-shadow: none;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      /*
       * Safe areas belong on the floating UI, not on the body: the canvas
       * should run edge to edge under the notch and the home indicator, while
       * every control stays inside the safe box.
       */
      .bottom-safe-panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }
      /*
       * ...and the TOP, which only the tour's card uses.
       *
       * Every other panel in the tool hangs off the bottom edge, because that
       * is where the thumbs are - so the top is the one band nothing else
       * claims, and a card that sits there covers neither the dock, nor the
       * panel slot, nor the walk quadrant in the bottom-left. It has to clear
       * the notch and the status bar like everything else.
       */
      .top-safe-panel { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); }
      /*
       * The lesson's words sit on the bottom edge with nothing under them, so
       * they clear the home indicator themselves rather than sitting inside a
       * panel that already did. Generous, because a line of type ending exactly
       * at the swipe bar is a line of type you cannot read without moving your
       * thumb.
       */
      .pb-safe-lesson { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.75rem); }
      /* The two cards that hand the controls back stand their words above
         them: the dock and the selection bar stack about nine and a half rem,
         and a card the chrome lands on is a card nobody can read. */
      .pb-safe-lesson-chrome { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 11rem); }
      /*
       * ...and the SIDES, which only matter when the phone is on its side and
       * are the whole difference there. Held in landscape the notch takes about
       * 44 px off one edge and the rounded corners a little off both, and the
       * dock's two clusters are anchored to exactly those corners - so the
       * left-hand one sat under the notch, with the control at its end
       * unreachable. Upright both insets are zero and this is the 0.75rem the
       * padding always was.
       */
      .x-safe-panel {
        padding-left: calc(env(safe-area-inset-left, 0px) + 0.75rem);
        padding-right: calc(env(safe-area-inset-right, 0px) + 0.75rem);
      }

      /* A flick strip has no room for a scrollbar, and never needs one. */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }

      /*
       * The activity hairline: a segment running the top edge while the tool is
       * waiting on something, and the whole line fading out in red when what it
       * waited on never arrived.
       */
      @keyframes perspective-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      @keyframes perspective-fade {
        0%   { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }
      /*
       * THE LESSON'S OWN TYPOGRAPHY, and it is the one place in this app that
       * has any.
       *
       * Everything else here is a mark on glass: hairlines, glyphs, a single
       * accent, no words. The lesson is the exception and has to be, because it
       * is the one thing the tool says rather than shows - so it gets the
       * opposite treatment on purpose. No panel, no border, no pill: the words
       * sit ON the picture over a wash of the page's own tone, one line at a
       * time, arriving rather than appearing.
       *
       * Staggered by hand at the call site rather than by a library. Three
       * elements, three delays, and the whole of the motion is fourteen pixels
       * of rise under a fade - which is the difference between a screen that
       * cuts and a screen that turns.
       */
      @keyframes lesson-rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes lesson-arrive {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: none; }
      }
      /* The dim under an act title: in and out on the same clock as the words. */
      @keyframes lesson-fade-dim {
        0% { opacity: 0; }
        22% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      /* The thumb the walk cards are asking for, pushing and coming back. */
      @keyframes lesson-push {
        0%, 100% { transform: translateY(0); opacity: 0.75; }
        45% { transform: translateY(-15px); opacity: 1; }
      }
      @keyframes lesson-curtain {
        0% { opacity: 0; letter-spacing: 0.42em; }
        30% { opacity: 1; }
        78% { opacity: 1; letter-spacing: 0.16em; }
        100% { opacity: 0; letter-spacing: 0.14em; }
      }

      @media (prefers-reduced-motion: reduce) {
        /* Standing still, it is still a line that is there or not there. */
        @keyframes perspective-sweep {
          0%, 100% { transform: translateX(100%); }
        }
        /* ...and the words are still words. Nothing moves; everything is
           legible, which is the only part of the above that was load-bearing. */
        @keyframes lesson-rise { from { opacity: 1; } to { opacity: 1; } }
        @keyframes lesson-arrive { from { opacity: 1; } to { opacity: 1; } }
        @keyframes lesson-curtain { 0%, 100% { opacity: 1; letter-spacing: 0.16em; } }
        @keyframes lesson-fade-dim { 0%, 100% { opacity: 1; } }
        /* Standing still, the ring still says where. */
        @keyframes lesson-push { 0%, 100% { transform: none; opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
