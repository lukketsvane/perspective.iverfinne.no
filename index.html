<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover puts the canvas under the notch and the home indicator;
         the UI keeps clear of them with env(safe-area-inset-*) below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Perspective — cubes at eye level</title>

    <!-- Home Screen install on iOS: full screen, no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perspective" />
    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Full viewport sizing with iOS safe area support */
      :root {
        --vh: 1vh;
      }
      body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        min-height: 100vh;
        min-height: calc(var(--vh, 1vh) * 100);
        min-height: 100dvh; /* Dynamic viewport height for mobile */
        overflow: hidden; 
        background-color: #f3f3f1; 
        touch-action: none;
        -webkit-overflow-scrolling: touch;
        /* Prevent PWA bottom gap on iOS standalone mode */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Disabling selection to make gestures smoother */
      * { user-select: none; -webkit-user-select: none; }
      /* No grey flash on tap, no magnifier, no rubber band. */
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      /* Controls stay visually weightless over the scene: no raised chrome or
         filled button states. Shape, border, icon and text carry the UI. */
      button {
        background-color: transparent !important;
        background-image: none !important;
        box-shadow: none !important;
      }
      [class*="shadow"] { box-shadow: none !important; }
      html, body { overscroll-behavior: none; }

      /*
       * Safe areas belong on the floating UI, not on the body: the canvas
       * should run edge to edge under the notch and the home indicator, while
       * every control stays inside the safe box.
       */
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .bottom-safe-panel { bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }

      /* A flick strip has no room for a scrollbar, and never needs one. */
      .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
